name: Backup Radiopedia API

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run fetch script
        run: node fetch_backup.js

      - name: Commit and push backup
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add backup-api.json
          git commit -m "Auto-update backup-api.json" || echo "No changes to commit"
          git push
