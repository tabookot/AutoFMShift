<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 
    Логотип Scorch Arena 
    Проект: AutoFMShift / scorch
    Пламя: 4 слоя (L1 ядро → L4 внешний) + малый левый язычок.
    Все слои центрированы по оси x=60 (было ~55), буква S — тоже.
    Динамическая версия (index.html, logoSync) подменяет 8 стопов:
    L1 = белый→A, L2 = A→⅓AB, L3 = ⅓AB→⅔AB, L4 = ⅔AB→B.
  -->
  <defs>
    <linearGradient id="fireL1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop id="f1t" offset="0" stop-color="#FFFFFF"/>
      <stop id="f1b" offset="1" stop-color="#FFD400"/>
    </linearGradient>
    <linearGradient id="fireL2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop id="f2t" offset="0" stop-color="#FFE24D"/>
      <stop id="f2b" offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="fireL3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop id="f3t" offset="0" stop-color="#FFB300"/>
      <stop id="f3b" offset="1" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="fireL4" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop id="f4t" offset="0" stop-color="#FF8A16"/>
      <stop id="f4b" offset="1" stop-color="#FF5500"/>
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232733" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>

    <!-- буква S убрана: пламя сплошное; маска оставлена пустой для
         совместимости инлайн-копии (index.html убирает mask= сам) -->
    <mask id="cutout">
      <rect width="120" height="120" fill="white" />
    </mask>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF7B00" flood-opacity="0.6"/>
    </filter>
  </defs>

  <polygon points="60,5 108,32.5 108,87.5 60,115 12,87.5 12,32.5" 
           fill="url(#shieldBg)" stroke="#2C3140" stroke-width="3" stroke-linejoin="round"/>
           
  <polygon points="60,15 99,37.5 99,82.5 60,105 21,82.5 21,37.5" 
           fill="none" stroke="url(#fireL4)" stroke-width="2" stroke-opacity="0.5" stroke-linejoin="round"/>

  <g filter="url(#glow)">
    <path d="M 63,18 C 67,24 72,31 77,39 C 83,48 87,58 88,68 C 89,79 83,90 73,95 C 67,98 60,99 54,96 C 43,92 35,82 33,71 C 31,61 35,50 42,42 C 47,36 51,30 54,25 C 56,22 58,19 63,18 Z" 
          fill="url(#fireL4)"/>
    <path d="M 63,33 C 67,38 71,44 75,51 C 79,58 81,66 80,74 C 79,83 73,90 65,93 C 57,95 49,92 44,86 C 39,80 38,72 41,64 C 44,56 48,49 52,42 C 55,38 58,34 63,33 Z" 
          fill="url(#fireL3)"/>
    <path d="M 63,49 C 66,54 69,59 72,65 C 75,71 76,78 74,84 C 72,90 67,94 62,94 C 56,94 51,90 49,84 C 47,78 48,72 51,66 C 54,60 58,54 61,49 C 62,47 63,47 63,49 Z" 
          fill="url(#fireL2)"/>
    <path d="M 63,64 C 67,68 70,73 72,79 C 74,85 73,91 69,95 C 65,99 59,99 55,95 C 51,91 50,85 52,79 C 54,73 57,68 60,64 C 61,62 62,62 63,64 Z" 
          fill="url(#fireL1)"/>
    <path d="M 49,66 C 51,63 53,59 54,54 C 55,51 55,47 54,44 C 51,48 48,52 46,57 C 44,61 44,65 46,69 C 47,71 49,73 51,74 C 49,71 48,68 49,66 Z" 
          fill="url(#fireL1)"/>
  </g>
</svg>