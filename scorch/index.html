<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scorch Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%98%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  /* theme tokens the game CSS reads + splash scene palette (rust biome) */
  :root {
    color-scheme: dark;
    --bg: #0a0d12; --panel: #10151d; --panel-light: #1a2029; --border: #2a3240;
    --accent: #ff3d4d; --accent-lo: #d9283a; --pink: #ff5c7a; --yellow: #f1c40f;
    --text: #d4dee8; --text-dim: #8a97a8; --radius: 12px;
    --sky1: #0b1526; --sky2: #182a44; --sky3: #31465e;
    --hillB: #2a120a; --hillF: #5e2c1e; --hillT: #a05a30;
    --glass: rgba(13, 18, 26, .68); --starA: 1; --planetA: .95;
    --crtA: .13; --junkC: rgba(200, 120, 80, .85);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #e7edf4; --panel: #f4f7fa; --panel-light: #ffffff; --border: #c4cdd9;
    --accent: #cd1f30; --accent-lo: #a61726; --pink: #d92b64; --yellow: #c79000;
    --text: #1d2a38; --text-dim: #5c6b7d;
    --sky1: #a8743c; --sky2: #cf9a5e; --sky3: #ead0a0;
    --hillB: #8a4530; --hillF: #b06040; --hillT: #d88a58;
    --glass: rgba(255, 255, 255, .68); --starA: 0; --planetA: .45;
    --crtA: .05; --junkC: rgba(120, 60, 35, .55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ============ splash scene ============ */
  #scSplash { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: linear-gradient(180deg, var(--sky1), var(--sky2) 62%, var(--sky3)); transition: opacity .3s, visibility .3s; }
  body.ingame #scSplash { opacity: 0; visibility: hidden; pointer-events: none; }
  #stars { position: absolute; inset: 0; opacity: var(--starA); }
  #stars i { position: absolute; border-radius: 50%; background: #fff; animation: tw ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
  #junk i { position: absolute; top: -6vh; width: 2px; height: 15px; border-radius: 1px; background: linear-gradient(transparent, var(--junkC)); animation: jfall linear infinite; }
  @keyframes jfall { 0% { transform: translate(0, -4vh); opacity: 0; } 12% { opacity: .8; } 82% { opacity: .7; } 100% { transform: translate(var(--dx, 2vw), 88vh); opacity: 0; } }
  .pw { position: absolute; top: -18vmin; right: -14vmin; width: 62vmin; height: 62vmin; opacity: var(--planetA); }
  .planet { position: relative; display: block; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(30% 22% at 34% 62%, rgba(93, 138, 58, .55), transparent 70%),
      radial-gradient(22% 16% at 62% 34%, rgba(138, 69, 48, .5), transparent 70%),
      radial-gradient(circle at 33% 30%, #e0be74, #c9a45e 55%, #7c5a2e);
    box-shadow: 0 0 90px rgba(224, 190, 116, .25); }
    .planet::before, .planet::after { content: ""; position: absolute; left: 50%; top: 50%; width: 190%; height: 44%; border: 5px solid rgba(180, 120, 80, .5); border-radius: 50%; transform: translate(-50%, -50%) rotate(-16deg); }
  .planet::before { z-index: -1; }
  .planet::after { border-color: transparent; border-bottom-color: rgba(180, 120, 80, .5); }
  .hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 30vh; display: block; }
  .hills .back { fill: var(--hillB); }
  .hills .front { fill: var(--hillF); }
  .hills .crest { fill: none; stroke: var(--hillT); stroke-width: 3; }
  /* turrets are driven purely by JS transform (stored x/y + tilt) — the
     old bottom+transform seat() read its own ROTATED rect back, a
     feedback loop that doubled and smeared the sprites on narrow screens */
  .tur { position: absolute; left: 0; top: 0; width: 72px; height: 72px; transform-origin: 50% 76%; will-change: transform; }
  .tur::after { content: ""; position: absolute; left: 50%; bottom: 7px; width: 44px; height: 9px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .4), transparent); }
  .shot { position: absolute; left: 0; top: 0; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #ffe9b0; box-shadow: 0 0 10px 3px rgba(255, 176, 32, .7); opacity: 0; }
  .boom { position: absolute; left: 0; top: 0; width: 92px; height: 92px; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, #fff8e0 0%, #ffb020 30%, rgba(255, 90, 30, .6) 55%, transparent 72%); }
  .pt { position: absolute; left: 0; top: 0; border-radius: 1px; pointer-events: none; }
  .dust { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(168, 138, 96, .5), transparent 72%); }
  .dirt { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #cbb490, #8a6a3a 60%, #5e4526); box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
  .crt { position: absolute; inset: 0; pointer-events: none; opacity: var(--crtA);
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .5) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(0, 0, 0, .35)); }

  /* ============ splash card ============ */
  .panel { position: relative; z-index: 2; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 18px 50px rgba(0, 0, 0, .35); max-width: min(94vw, 560px); max-height: 94vh; overflow-y: auto; padding: 28px 36px 20px; text-align: center; }
  .card h1 { font: 900 clamp(28px, 5.5vw, 50px)/1.15 Orbitron, monospace; letter-spacing: .14em; color: var(--accent); text-shadow: 0 2px 0 rgba(0, 0, 0, .25), 0 0 28px rgba(255, 61, 77, .25); text-wrap: balance; }
  .tag { margin: 8px 0 4px; color: var(--text-dim); font-size: 13px; letter-spacing: .06em; }
  .cta { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .play { display: inline-flex; align-items: center; gap: 10px; padding: 14px 38px; border-radius: 14px; border: 1px solid transparent; cursor: pointer;
    font: 800 18px Orbitron, monospace; letter-spacing: .14em; color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
    background: linear-gradient(180deg, var(--accent), var(--accent-lo)); box-shadow: 0 6px 24px rgba(255, 61, 77, .28), inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: transform .12s, box-shadow .2s; }
  .play:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 61, 77, .38), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .play:active { transform: translateY(0) scale(.97); }
  .opt { display: inline-flex; align-items: center; padding: 14px 24px; border-radius: 14px; border: 1px solid var(--border); background: transparent; cursor: pointer;
    font: 700 14px Orbitron, monospace; letter-spacing: .12em; color: var(--text); transition: border-color .15s, color .15s; }
  .opt:hover { border-color: var(--accent); color: var(--accent); }

  /* ============ the music player ============ */
  .sc-mus { margin-top: 16px; text-align: left; }
  .sc-musbar { display: flex; align-items: center; gap: 6px; }
  .mp-b { width: 32px; height: 32px; flex: none; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .mp-b:hover { border-color: var(--accent); color: var(--accent); }
  .mp-main { border-color: var(--accent); color: var(--accent); }
  .mp-mid { flex: 1; min-width: 0; margin: 0 4px; }
  .mp-meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .mp-meta b { font: 700 12.5px Orbitron, monospace; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-meta span { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-prog { margin-top: 5px; height: 6px; border-radius: 3px; background: rgba(127, 127, 127, .18); cursor: pointer; position: relative; }
  .mp-prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-lo)); }
  .mp-time { font: 700 10.5px Orbitron, monospace; color: var(--text-dim); flex: none; min-width: 76px; text-align: right; }
  .mp-list { display: none; margin-top: 8px; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .mp-list.show { display: block; }
  .mp-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text); border-bottom: 1px solid var(--border); }
  .mp-row:last-child { border-bottom: none; }
  .mp-row:hover { background: rgba(127, 127, 127, .1); }
  .mp-row.cur { color: var(--accent); }
  .mp-row .n { width: 18px; color: var(--text-dim); font: 700 10px Orbitron, monospace; flex: none; }
  .mp-row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-row .t span { color: var(--text-dim); }
  .mp-row .d { color: var(--text-dim); font: 400 10px Orbitron, monospace; flex: none; }
  .mp-eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; flex: none; }
  .mp-eq i { width: 3px; background: var(--accent); animation: eq .8s ease-in-out infinite; }
  .mp-eq i:nth-child(2) { animation-delay: .2s; }
  .mp-eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }

  .sub { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: center; margin-top: 18px; }
  .themes { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 999px; background: rgba(127, 127, 127, .06); }
  .tbtn { width: 34px; height: 34px; border-radius: 999px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
  .tbtn:hover { color: var(--text); background: rgba(127, 127, 127, .14); }
  .tbtn.sel { background: var(--accent); color: #fff; }
  .linkrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #dep { color: var(--text-dim); font: 12.5px/1.4 ui-monospace, Consolas, monospace; text-decoration: none; border-bottom: 1px dashed var(--border); padding-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  #dep:hover { color: var(--accent); border-color: var(--accent); }
  .ic { position: relative; width: 30px; height: 30px; flex: none; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s; }
  .ic:hover { border-color: var(--accent); color: var(--accent); }
  .ic.done { border-color: var(--accent); color: var(--accent); }
  .ic.done::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .lstat { min-height: 16px; margin-top: 10px; font-size: 12px; color: var(--accent); opacity: 0; transition: opacity .3s; }
  .lstat.show { opacity: 1; }
  .foot { margin-top: 6px; font-size: 11px; color: var(--text-dim); opacity: .8; }
  .foot a { color: var(--text-dim); text-decoration: none; border-bottom: 1px dotted var(--border); }
  .foot a:hover { color: var(--accent); border-color: var(--accent); }
  @media (max-height: 620px) { .card { padding: 16px 22px 12px; } .play { padding: 11px 30px; } .sc-mus { margin-top: 10px; } }
  @media (prefers-reduced-motion: reduce) { #junk i, #stars i, .mp-eq i { animation: none; } .play, .tbtn, .mp-b { transition: none; } }
</style>
<script>
  // apply the stored theme before first paint (no wrong-theme flash)
  try {
    const t = localStorage.getItem('scorch_theme') || 'system';
    const dark = t === 'dark' || (t === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
</head>
<body>
<div id="scSplash">
  <div id="stars"></div>
  <div class="pw"><i class="planet"></i></div>
  <div id="junk"></div>
  <svg class="hills" viewBox="0 0 1200 320" preserveAspectRatio="none" aria-hidden="true">
    <path class="back" d="M0 320 V150 L110 98 L230 138 L340 80 L470 146 L600 88 L730 150 L850 102 L980 152 L1080 114 L1200 148 V320 Z"/>
    <path class="front" d="M0 320 V240 L70 208 L150 232 L230 176 L290 176 L350 216 L460 182 L560 222 L640 160 L700 160 L780 210 L890 176 L1000 218 L1100 190 L1200 216 V320 Z"/>
    <path class="crest" d="M0 240 L70 208 L150 232 L230 176 L290 176 L350 216 L460 182 L560 222 L640 160 L700 160 L780 210 L890 176 L1000 218 L1100 190 L1200 216"/>
  </svg>
  <canvas id="tA" class="tur" width="72" height="72"></canvas>
  <canvas id="tB" class="tur" width="72" height="72"></canvas>
  <div class="shot" id="shotA"></div>
  <div class="shot" id="shotB"></div>
  <div class="crt"></div>
  <main class="panel">
    <div class="card">
      <h1>SCORCH ARENA</h1>
      <p class="tag">система Вейл · войны shareware · дань уважения Scorched Earth</p>
      <div class="cta">
        <button id="play" class="play" autofocus>
          <svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>
          В БОЙ
        </button>
        <button id="opts" class="opt" title="Игроки, режим, громкости — без запуска боя">ОПЦИИ</button>
      </div>
      <div class="sc-mus" id="scMus">
        <div class="sc-musbar">
          <button class="mp-b" id="mpPrev" title="Предыдущий трек"><svg width="13" height="13" viewBox="0 0 12 12"><path d="M2 1h2v10H2zM11 1v10L4.5 6z" fill="currentColor"/></svg></button>
          <button class="mp-b mp-main" id="mpPlay" title="Пуск/пауза"></button>
          <button class="mp-b" id="mpStop" title="Стоп"><svg width="11" height="11" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="currentColor"/></svg></button>
          <button class="mp-b" id="mpNext" title="Следующий трек"><svg width="13" height="13" viewBox="0 0 12 12"><path d="M8 1h2v10H8zM1 1v10l6.5-5z" fill="currentColor"/></svg></button>
          <div class="mp-mid">
            <div class="mp-meta"><b id="mpName">—</b><span id="mpArtist"></span></div>
            <div class="mp-prog" id="mpProg" title="Клик — перемотка"><i id="mpFill"></i></div>
          </div>
          <span class="mp-time" id="mpTime">0:00 / 0:00</span>
          <button class="mp-b" id="mpTgl" title="Плейлист"><svg width="13" height="13" viewBox="0 0 12 12"><path d="M1 2h10v1.4H1zM1 5.3h10v1.4H1zM1 8.6h6.5V10H1z" fill="currentColor"/></svg></button>
        </div>
        <div class="mp-list" id="mpListBox"></div>
      </div>
      <div class="sub">
        <div class="themes" role="group" aria-label="Тема оформления">
          <button class="tbtn" data-t="system" title="Системная тема">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="12" height="8.5" rx="1.5"/><path d="M6 13.5h4M8 11.5v2"/></svg>
          </button>
          <button class="tbtn" data-t="light" title="Светлая тема">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>
          </button>
          <button class="tbtn" data-t="dark" title="Тёмная тема">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/></svg>
          </button>
        </div>
        <div class="linkrow">
          <a id="dep" href="https://tabookot.github.io/AutoFMShift/scorch" target="_blank" rel="noopener" title="Открыть в новой вкладке">tabookot.github.io/AutoFMShift/scorch</a>
          <button id="copyL" class="ic" title="Скопировать ссылку">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
          </button>
          <button id="saveL" class="ic" title="Сохранить ярлык (.url)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0l3-3m-3 3L5 7M3 13h10"/></svg>
          </button>
        </div>
      </div>
      <p class="lstat" id="lstat"></p>
      <p class="foot">чистый HTML · CSS · JS — без фреймворков · © <a href="https://z.ai" target="_blank" rel="noopener">GLM</a> · <a href="https://github.com/tabookot" target="_blank" rel="noopener">tabookot</a></p>
    </div>
  </main>
</div>
<!-- the parts are deliberately plain top-level scripts sharing one
     lexical scope (see the header of scorch.core.js): classic tags in the
     core → music → world → ui order run them as the old single file, no
     loader, no fetch — works even straight from file:// -->
<script src="scorch.core.js"></script>
<script src="scorch.music.js"></script>
<script src="scorch.world.js"></script>
<script src="scorch.ui.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const splash = $('#scSplash');

  // ============ theme: system default, LS-persisted ============
  const TKEY = 'scorch_theme';
  const mq = matchMedia('(prefers-color-scheme: light)');
  const stored = () => { try { return localStorage.getItem(TKEY) || 'system'; } catch (e) { return 'system'; } };
  const apply = (mode) => {
    const dark = mode === 'dark' || (mode === 'system' && !mq.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelectorAll('.tbtn').forEach((b) => b.classList.toggle('sel', b.dataset.t === mode));
  };
  apply(stored());
  document.querySelectorAll('.tbtn').forEach((b) => b.addEventListener('click', () => {
    try { localStorage.setItem(TKEY, b.dataset.t); } catch (e) {}
    apply(b.dataset.t);
  }));
  try { mq.addEventListener('change', () => { if (stored() === 'system') apply('system'); }); }
  catch (e) { mq.addListener(() => { if (stored() === 'system') apply('system'); }); }

  // ============ launch: the explicit buttons open and re-open ============
  const syncOpen = () => document.body.classList.toggle('ingame', !!document.querySelector('.sc-overlay.show'));
  $('#play').addEventListener('click', () => { window.Scorch.open(); syncOpen(); });
  $('#opts').addEventListener('click', () => {
    if (window.Scorch && window.Scorch.options) { window.Scorch.options(); syncOpen(); }
  });
  setInterval(syncOpen, 400);

  // ============ turret sprites + JS-driven placement ============
  const tA = $('#tA'), tB = $('#tB');
  const drawSplashTurret = (cv, col, hull, dir) => {
    const c = cv.getContext('2d');
    c.save();
    c.translate(cv.width / 2, cv.height * 0.76);
    const s = cv.width / 38;
    c.scale(s, s);
    drawTurretBody(c, 0, 0, col, { noShadow: true, hull, seed: 5, dir, ang: 25 });
    c.restore();
  };
  drawSplashTurret(tA, '#2ecc71', 'classic', 1);
  drawSplashTurret(tB, '#ff4757', 'howitzer', -1);
  const TA = { el: tA, dir: 1, S: 72, x: 0, y: 0 };
  const TB = { el: tB, dir: -1, S: 72, x: 0, y: 0 };
  const layoutTur = () => {
    const w = innerWidth;
    const S = w < 560 ? 52 : 72;
    [TA, TB].forEach(t => {
      t.S = S;
      t.el.style.width = S + 'px';
      t.el.style.height = S + 'px';
    });
    const m = Math.max(6, w * 0.06);
    TA.x = m;
    TB.x = w - S - m;
  };
  const seat = (t) => {
    const cx = t.x + t.S / 2;
    const cxs = clamp(cx / innerWidth, 0, 1) * 1200;
    const dy = (yAt(cxs + 26) - yAt(cxs - 26)) * (innerHeight * 0.3 / 320);
    const ang = clamp(Math.atan2(dy, 52 * (innerWidth / 1200)) * 180 / Math.PI, -14, 14);
    t.y = groundY(cx) - t.S * 0.76;
    t.el.style.transform = 'translate(' + t.x.toFixed(1) + 'px,' + t.y.toFixed(1) + 'px) rotate(' + ang.toFixed(2) + 'deg)';
  };
  const muzz = (t) => [t.x + t.S / 2 + t.dir * 15, t.y + t.S * 0.16];
  const tgt = (t) => [t.x + t.S / 2, t.y + t.S * 0.42];

  // ============ ambient scene: stars + junk rain ============
  const stars = $('#stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    const sz = (0.7 + Math.random() * 1.9).toFixed(1);
    s.style.cssText = `left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 58).toFixed(1)}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random() * 3).toFixed(2)}s;animation-duration:${(2 + Math.random() * 3).toFixed(2)}s`;
    stars.appendChild(s);
  }
  const jk = $('#junk');
  for (let i = 0; i < 7; i++) {
    const j = document.createElement('i');
    j.style.cssText = `left:${(Math.random() * 100).toFixed(1)}%;animation-duration:${(4 + Math.random() * 5).toFixed(2)}s;animation-delay:${(Math.random() * 6).toFixed(2)}s;--dx:${(Math.random() * 6 - 3).toFixed(1)}vw`;
    jk.appendChild(j);
  }

  // ============ TERRAFORMING: the front hill is a live model ============
  const front = document.querySelector('.hills .front');
  const crest = document.querySelector('.hills .crest');
  const PX = [0, 70, 150, 230, 290, 350, 460, 560, 640, 700, 780, 890, 1000, 1100, 1200];
  const Y0 = [240, 208, 232, 176, 176, 216, 182, 222, 160, 160, 210, 176, 218, 190, 216];
  let Y = Y0.slice(), Yt = Y0.slice(), rate = 1.4;
  const pathD = (ys, fill) => (fill ? 'M0 320 V' : 'M0 ') + ys[0] + PX.slice(1).map((x, i) => ' L' + x + ' ' + ys[i + 1]).join('') + (fill ? ' V320 Z' : '');
  const yAt = (x) => {
    for (let i = 1; i < PX.length; i++) if (x <= PX[i]) {
      const f = (x - PX[i - 1]) / (PX[i] - PX[i - 1]);
      return Y[i - 1] + (Y[i] - Y[i - 1]) * f;
    }
    return Y[Y.length - 1];
  };
  const prof = (cx, dip, rim, w) => Y0.map((y, i) => {
    const t = (PX[i] - cx) / w;
    return y + dip * Math.exp(-t * t) - rim * Math.exp(-Math.pow((PX[i] - cx) / (w * 2.1), 2));
  });
  const groundY = (x) => innerHeight - (320 - yAt(clamp(x / innerWidth, 0, 1) * 1200)) / 320 * (innerHeight * 0.3);

  // ---- FX: booms, dirt debris, dust, quake ----
  const boomAt = (x, y, r) => {
    const b = document.createElement('i');
    b.className = 'boom';
    b.style.left = x + 'px'; b.style.top = y + 'px';
    if (r) { b.style.width = r * 2 + 'px'; b.style.height = r * 2 + 'px'; }
    splash.appendChild(b);
    if (!b.animate) { setTimeout(() => b.remove(), 600); return; }
    b.animate(
      [{ opacity: 0.95, transform: 'translate(-50%,-50%) scale(.25)' },
       { opacity: 0, transform: 'translate(-50%,-50%) scale(1.55)' }],
      { duration: 600, easing: 'ease-out' }).onfinish = () => b.remove();
  };
  let parts = [];
  const burst = (x, y, n) => {
    const cols = ['#8a4530', '#5e2c1e', '#d88a58', '#3a1c10'];
    for (let k = 0; k < n; k++) {
      const el = document.createElement('i');
      el.className = 'pt';
      const sz = 3 + Math.random() * 3;
      el.style.cssText = `width:${sz.toFixed(1)}px;height:${(sz * 0.8).toFixed(1)}px;background:${cols[(Math.random() * cols.length) | 0]}`;
      splash.appendChild(el);
      parts.push({ el, x, y: y - 4, vx: Math.random() * 280 - 140, vy: -120 - Math.random() * 320, rot: Math.random() * 6, vr: Math.random() * 12 - 6, life: 1.6 });
    }
  };
  const puff = (x, y, n) => {
    for (let k = 0; k < n; k++) {
      const d = document.createElement('i');
      d.className = 'dust';
      const sz = 26 + Math.random() * 34;
      d.style.cssText = `left:${(x + Math.random() * 30 - 15).toFixed(0)}px;top:${(y - Math.random() * 14).toFixed(0)}px;width:${sz.toFixed(0)}px;height:${(sz * 0.7).toFixed(0)}px`;
      splash.appendChild(d);
      if (!d.animate) { setTimeout(() => d.remove(), 900); continue; }
      d.animate(
        [{ opacity: 0.7, transform: 'translate(-50%,-50%) scale(.4)' },
         { opacity: 0, transform: `translate(calc(-50% + ${(Math.random() * 44 - 22).toFixed(0)}px), calc(-50% - ${(18 + Math.random() * 26).toFixed(0)}px)) scale(1.7)` }],
        { duration: 900 + Math.random() * 500, easing: 'ease-out' }).onfinish = () => d.remove();
    }
  };
  const quake = () => {
    if (!splash.animate) return;
    splash.animate(
      [{ transform: 'translate(0,0)' }, { transform: 'translate(-6px,3px)' }, { transform: 'translate(5px,-4px)' }, { transform: 'translate(-3px,2px)' }, { transform: 'translate(0,0)' }],
      { duration: 320, easing: 'ease-out' });
  };

  // ---- the dirt ball: a lobbed mound-maker from the rival turret ----
  let flyers = [];
  const dirtBall = (from, to, cb) => {
    const el = document.createElement('i');
    el.className = 'dirt';
    splash.appendChild(el);
    const p0 = muzz(from);
    const tt = tgt(to);
    const p2 = [tt[0] - 8 * Math.sign(tt[0] - p0[0]), tt[1]];
    flyers.push({ el, p0, p2, cp: [(p0[0] + p2[0]) / 2, Math.min(p0[1], p2[1]) - innerHeight * 0.22], t: 0, dur: 1.15, cb });
  };

  // ---- the director: blast a crater → dirt ball fills it → relax ----
  let tf = { phase: 'wait', t: 1.4, a: TA, b: TB, cx: 0 };
  const tfStep = (dt) => {
    tf.t -= dt;
    if (tf.t > 0) return;
    if (tf.phase === 'wait') {
      const sx = tf.a.x + tf.a.S / 2;
      tf.cx = (sx / innerWidth) * 1200;
      const gy = groundY(sx);
      boomAt(sx, gy, 54); burst(sx, gy, 14); puff(sx, gy, 3); quake();
      Yt = prof(tf.cx, 64, 16, 95); rate = 5;
      tf.phase = 'cratered'; tf.t = 2.6;
    } else if (tf.phase === 'cratered') {
      dirtBall(tf.b, tf.a, () => {
        const sx2 = tf.a.x + tf.a.S / 2;
        puff(sx2, groundY(sx2), 4);
        Yt = prof(tf.cx, -26, 7, 105); rate = 3.2;
        tf.phase = 'filled'; tf.t = 2.4;
      });
      tf.phase = 'dropping'; tf.t = 2.6; // flight time + safety timeout
    } else if (tf.phase === 'dropping') {
      tf.phase = 'filled'; tf.t = 0.1;   // ball lost (hidden tab) — settle
    } else if (tf.phase === 'filled') {
      Yt = Y0.slice(); rate = 1.1;       // the ground relaxes to its rest
      tf.phase = 'wait'; tf.t = 2.8;
      const tmp = tf.a; tf.a = tf.b; tf.b = tmp; // next cycle digs the other side
    }
  };

  // ---- missile dots: arcs re-aimed every volley from the LIVE spots ----
  const shots = [
    { dot: $('#shotA'), from: TA, to: TB, fly: 2.4, gap: 3.2, t0: -4000, hit: false, p0: null },
    { dot: $('#shotB'), from: TB, to: TA, fly: 2.7, gap: 3.7, t0: -9000, hit: false, p0: null }
  ];
  const aim = (s) => {
    s.p0 = muzz(s.from);
    const tt = tgt(s.to);
    s.p2 = [tt[0] - 20 * Math.sign(tt[0] - s.p0[0]), tt[1]];
    s.cp = [(s.p0[0] + s.p2[0]) / 2, Math.min(s.p0[1], s.p2[1]) - innerHeight * 0.24];
    s.hit = false;
  };
  const arcStep = (s, now) => {
    const lt = (now - s.t0) / 1000;
    if (!s.p0 || lt > s.fly + s.gap) { s.t0 = now; aim(s); return; }
    const t = Math.min(1, lt / s.fly), u = 1 - t;
    const x = u * u * s.p0[0] + 2 * u * t * s.cp[0] + t * t * s.p2[0];
    const y = u * u * s.p0[1] + 2 * u * t * s.cp[1] + t * t * s.p2[1];
    s.dot.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    s.dot.style.opacity = lt < s.fly ? 1 : 0;
    if (t > 0.96 && !s.hit) { s.hit = true; boomAt(s.p2[0], s.p2[1], 40); }
  };
  addEventListener('resize', () => { layoutTur(); shots.forEach((s) => { s.p0 = null; }); });

  // ============ the frame loop ============
  layoutTur();
  seat(TA); seat(TB);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let last = performance.now();
    const loop = (now) => {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (document.body.classList.contains('ingame')) return;
      const k = Math.min(1, rate * dt);
      let moved = false;
      for (let i = 0; i < Y.length; i++) {
        const d = (Yt[i] - Y[i]) * k;
        if (Math.abs(d) > 0.01) { Y[i] += d; moved = true; }
      }
      if (moved) {
        front.setAttribute('d', pathD(Y, true));
        crest.setAttribute('d', pathD(Y, false));
      }
      tfStep(dt);
      seat(TA); seat(TB);
      shots.forEach((s) => arcStep(s, now));
      flyers = flyers.filter((f) => {
        f.t += dt;
        const q = Math.min(1, f.t / f.dur), u = 1 - q;
        const x = u * u * f.p0[0] + 2 * u * q * f.cp[0] + q * q * f.p2[0];
        const y = u * u * f.p0[1] + 2 * u * q * f.cp[1] + q * q * f.p2[1];
        f.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
        if (q >= 1) { f.el.remove(); if (f.cb) f.cb(); return false; }
        return true;
      });
      parts = parts.filter((p) => {
        p.life -= dt;
        p.vy += 1500 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        if (p.y >= groundY(p.x) - 2 || p.life <= 0) {
          if (p.el.animate) p.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240 }).onfinish = () => p.el.remove();
          else p.el.remove();
          return false;
        }
        p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg)`;
        return true;
      });
    };
    requestAnimationFrame(loop);
  }

  // ============ the music player: the splash playlist ============
  const hasMus = typeof musicPlayIdx === 'function';
  const musBox = $('#scMus');
  if (hasMus) {
    const splashIdx = MTRACKS.findIndex(t => t.splash);
    const fmt = (s) => { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
    const IC_P = '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>';
    const IC_PA = '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>';
    const listBox = $('#mpListBox');
    const nameEl = $('#mpName'), artEl = $('#mpArtist'), timeEl = $('#mpTime');
    const fill = $('#mpFill'), playB = $('#mpPlay'), prog = $('#mpProg');
    const rows = MTRACKS.map((t, i) => {
      const r = document.createElement('div');
      r.className = 'mp-row';
      r.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${t.name} <span>— ${t.artist || ''}</span></span><span class="d">${fmt(musicTrackDur(i))}</span>`;
      r.onclick = () => musicPlayIdx(i);
      listBox.appendChild(r);
      return r;
    });
    $('#mpPrev').onclick = () => musicSkip(-1);
    $('#mpNext').onclick = () => musicSkip(1);
    $('#mpStop').onclick = () => musicHalt();
    playB.onclick = () => {
      const inf = musicInfo();
      if (inf && inf.playing) musicPause();
      else if (inf && inf.stopped) musicPlayIdx(inf.idx);
      else if (inf && inf.paused) musicResume();
      else musicPlayIdx(splashIdx >= 0 ? splashIdx : 0);
    };
    $('#mpTgl').onclick = () => listBox.classList.toggle('show');
    prog.onclick = (e) => {
      const inf = musicInfo();
      if (!inf || !inf.dur) return;
      const r = prog.getBoundingClientRect();
      musicSeek(clamp((e.clientX - r.left) / r.width, 0, 1) * inf.dur);
    };
    // the wheel over any player button trims the music volume (0.1%);
    // pointerdown preventDefault keeps the click but never focuses the
    // button — no lingering highlight after a tap or a click
    let volT = null;
    const flashVol = () => {
      timeEl.textContent = '♪ ' + (musicVol() * 100).toFixed(1) + '%';
      clearTimeout(volT);
      volT = setTimeout(() => { volT = null; }, 900);
    };
    ['mpPrev', 'mpPlay', 'mpStop', 'mpNext', 'mpTgl'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => e.preventDefault());
      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        musicSetVol(clamp(musicVol() + (e.deltaY < 0 ? 0.001 : -0.001), 0, 1));
        flashVol();
      }, { passive: false });
      el.addEventListener('click', () => el.blur());
    });
    ['pointerdown', 'click'].forEach(ev => musBox.addEventListener(ev, e => e.stopPropagation()));
    const uiTick = () => {
      if (!document.body.classList.contains('ingame')) {
        const inf = musicInfo();
        if (inf) {
          nameEl.textContent = inf.name;
          artEl.textContent = inf.artist ? '— ' + inf.artist : '';
          if (!volT) timeEl.textContent = fmt(inf.pos) + ' / ' + fmt(inf.dur);
          fill.style.width = (inf.dur ? clamp(inf.pos / inf.dur, 0, 1) * 100 : 0).toFixed(1) + '%';
          playB.innerHTML = inf.playing ? IC_PA : IC_P;
          rows.forEach((r, i) => {
            const cur = i === inf.idx;
            r.classList.toggle('cur', cur);
            const eq = r.querySelector('.mp-eq');
            if (cur && inf.playing && !eq) r.querySelector('.n').insertAdjacentHTML('afterend', '<span class="mp-eq"><i></i><i></i><i></i></span>');
            else if ((!cur || !inf.playing) && eq) eq.remove();
          });
        }
      }
      setTimeout(uiTick, 250);
    };
    uiTick();
    // the splash melody: starts with the page (browser audio policies
    // hold it until the first gesture), returns after every duel; the
    // OPTIONS window never stops it
    const syncMusic = () => {
      if (document.body.classList.contains('ingame')) return;
      // a persistent STOP wins — read the RAW flag (musicInfo() is null
      // before the first track loads and hid the state on a fresh page):
      // the splash stays silent until Play is pressed
      if (typeof musicStopped === 'function' && musicStopped()) return;
      if (!musicAlive()) {
        ensureAudio();
        musicStart();
        if (splashIdx >= 0) musicPlayIdx(splashIdx);
      }
    };
    syncMusic();
    setInterval(syncMusic, 500);
  } else {
    musBox.style.display = 'none';
  }

  // ============ deploy link: copy + save a .url shortcut, state in LS ============
  const DEP = 'https://tabookot.github.io/AutoFMShift/scorch';
  const LKEY = 'scorch_link';
  let lst = { copied: 0, saved: 0 };
  try { Object.assign(lst, JSON.parse(localStorage.getItem(LKEY)) || {}); } catch (e) {}
  const stat = $('#lstat');
  let statT = null;
  const flash = (msg) => {
    stat.textContent = msg;
    stat.classList.add('show');
    clearTimeout(statT);
    statT = setTimeout(() => stat.classList.remove('show'), 1800);
  };
  const persist = () => { try { localStorage.setItem(LKEY, JSON.stringify(lst)); } catch (e) {} };
  const copyBtn = $('#copyL'), saveBtn = $('#saveL');
  const mark = () => {
    copyBtn.classList.toggle('done', !!lst.copied);
    saveBtn.classList.toggle('done', !!lst.saved);
  };
  mark();
  copyBtn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(DEP); ok = true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = DEP;
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove();
    }
    if (ok) { lst.copied = 1; persist(); mark(); flash('ссылка скопирована'); }
    else flash('не удалось скопировать');
  });
  saveBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['[InternetShortcut]\r\nURL=' + DEP + '\r\n'], { type: 'text/plain' }));
    a.download = 'Scorch Arena.url';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    lst.saved = 1;
    persist();
    mark();
    flash('ярлык сохранён');
  });
})();
</script>
</body>
